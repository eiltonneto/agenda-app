services:
  db:
    image: postgres:16-alpine
    container_name: agendaapp-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agendaapp
    ports:
      - "5432:5432"
    volumes:
      - agendaapp_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agendaapp"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: agendaapp-backend
    working_dir: /app
    ports:
      - "3333:3333"
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: development
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run dev"

volumes:
  agendaapp_pgdata:
